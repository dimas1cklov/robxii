<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Increaser UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background for the overall page */
        }
        
        .mobile-container {
            max-width: 414px; /* iPhone Max width */
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Subtle animated background pattern matching the screenshot header */
        .bg-pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 150px;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        .content-z {
            position: relative;
            z-index: 10;
        }

        /* Balance update animation */
        .balance-bump {
            animation: bump 0.3s ease-out;
        }

        @keyframes bump {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="antialiased text-gray-900">

    <div class="mobile-container">
        <div class="bg-pattern"></div>

        <!-- Top Navigation Bar -->
        <div class="content-z flex items-center justify-between px-4 py-4 border-b border-gray-100 bg-white/80 backdrop-blur-sm sticky top-0">
            <!-- Close Button -->
            <button class="p-2 text-gray-400 hover:text-gray-600 transition-colors">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <!-- Balance Display -->
            <div class="flex items-center gap-2 font-bold text-xl">
                <!-- Robux Image Icon -->
                <img src="https://cdn.imagetourls.com/uploads/tyImg/1a7olCdr8.png" alt="robux.png" class="w-6 h-6 object-contain" />
                <span id="balance-display" class="transition-all duration-300 origin-left inline-block">3</span>
            </div>

            <!-- Send Button -->
            <button class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-800 px-3 py-1.5 rounded-full text-sm font-semibold transition-colors">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="19" x2="12" y2="5"></line>
                    <polyline points="5 12 12 5 19 12"></polyline>
                </svg>
                Send
            </button>
        </div>

        <!-- Main Content -->
        <div class="content-z px-5 py-6">
            <h1 class="text-2xl font-bold mb-2">Robux packages</h1>
            <p class="text-gray-500 text-sm leading-relaxed mb-6">
                By purchasing Robux, you agree to our Terms of Use, including the arbitration clause and revocation policy.
            </p>

            <!-- Packages Container -->
            <div class="bg-[#f8f9fb] rounded-3xl p-4 pt-5 pb-5 shadow-sm border border-gray-50" id="packages-list">
                <!-- Items will be injected here by JS -->
            </div>
        </div>
    </div>

    <script>
        // Initial Balance
        let currentBalance = 3;
        let animationFrameId = null;
        const balanceDisplay = document.getElementById('balance-display');
        const packagesContainer = document.getElementById('packages-list');

        // Package Data (Amount to add)
        const packages = [
            { amount: 22500, label: "22,500", highlight: false },
            { amount: 10000, label: "10,000", highlight: false },
            { amount: 4500, label: "4,500", highlight: false },
            { amount: 3150, label: "3,150", highlight: false },
            { amount: 1700, label: "1,700", highlight: false },
            { amount: 1200, label: "1,200", highlight: false },
            { amount: 800, label: "800", highlight: false },
            { amount: 400, label: "400", highlight: false },
            { amount: 80, label: "80", highlight: true, tag: "For you" }
        ];

        // Format number with commas
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        // Ticking animation function
        function animateValue(start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                
                // easeOut function for smoother deceleration
                const easeProgress = progress * (2 - progress);
                
                const currentVal = Math.floor(easeProgress * (end - start) + start);
                balanceDisplay.textContent = formatNumber(currentVal);
                
                if (progress < 1) {
                    animationFrameId = window.requestAnimationFrame(step);
                } else {
                    balanceDisplay.textContent = formatNumber(end);
                }
            };
            
            // Cancel any ongoing animation to prevent jumping
            if (animationFrameId) {
                window.cancelAnimationFrame(animationFrameId);
            }
            window.requestAnimationFrame(step);
        }

        // Handle Get Button Click
        function handleGetClick(amount) {
            const previousBalance = currentBalance;
            currentBalance += amount;
            
            // Add animation class for the scale bump
            balanceDisplay.classList.remove('balance-bump');
            
            // Trigger reflow to restart animation
            void balanceDisplay.offsetWidth; 
            
            balanceDisplay.classList.add('balance-bump');
            
            // Start the ticking animation (duration in milliseconds)
            animateValue(previousBalance, currentBalance, 1000);
        }

        // Generate the UI
        function renderPackages() {
            packages.forEach((pkg, index) => {
                const isLast = index === packages.length - 1;
                
                // Image Icon reused for items
                const iconSvg = `
                    <img src="https://cdn.imagetourls.com/uploads/tyImg/1a7olCdr8.png" alt="robux.png" class="w-[20px] h-[20px] object-contain" />
                `;

                // Tag HTML if it exists
                const tagHtml = pkg.tag ? `
                    <div class="flex items-center gap-1 bg-gray-200/60 text-gray-600 text-xs px-2 py-0.5 rounded-full font-medium ml-2">
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
                        ${pkg.tag}
                    </div>
                ` : '';

                // Determine button style based on highlight property
                const buttonClass = pkg.highlight 
                    ? "bg-blue-600 hover:bg-blue-700 text-white shadow-md shadow-blue-500/30" 
                    : "bg-[#e2e4e9] hover:bg-[#d1d5db] text-gray-800";

                const itemHtml = `
                    <div class="flex items-center justify-between mb-4 last:mb-0">
                        <div class="flex items-center gap-3">
                            ${iconSvg}
                            <div class="flex items-center">
                                <span class="font-bold text-xl">${pkg.label}</span>
                                ${tagHtml}
                            </div>
                        </div>
                        <button 
                            onclick="handleGetClick(${pkg.amount})"
                            class="${buttonClass} px-6 py-2.5 rounded-lg font-semibold w-[100px] transition-all active:scale-95 flex justify-center items-center">
                            Get
                        </button>
                    </div>
                `;

                packagesContainer.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // Initialize
        renderPackages();
    </script>
</body>
</html>
